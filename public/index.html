<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory App</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f5f5f5;
}

h2{
  margin:10px;
}

#monthPage{
  display:grid;
  grid-template-columns: repeat(auto-fill,minmax(120px,1fr));
  gap:10px;
  padding:10px;
}

.month{
  background:white;
  border-radius:12px;
  padding:10px;
  text-align:center;
  cursor:pointer;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.cover-wrap{
  position:relative;
}

.cover-wrap img{
  width:100%;
  height:90px;
  object-fit:cover;
  border-radius:10px;
}

.cover-text{
  position:absolute;
  bottom:5px;
  left:5px;
  right:5px;
  color:white;
  background:rgba(0,0,0,0.4);
  border-radius:5px;
  font-size:12px;
}

.no-cover{
  height:90px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  background:#eee;
  border-radius:10px;
}

#gallery{
  display:grid;
  grid-template-columns: repeat(auto-fill,minmax(100px,1fr));
  gap:10px;
  padding:10px;
}

.item-wrap img,
.item-wrap video{
  width:100%;
  border-radius:10px;
  cursor:pointer;
}

#popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  display:none;
  align-items:center;
  justify-content:center;
}

#popup img,
#popup video{
  max-width:90%;
  max-height:90%;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" style="padding:20px;">
  <h2>ใส่รหัสผ่าน</h2>
  <input id="passInput" type="password">
  <button onclick="checkPassword()">เข้าใช้งาน</button>
</div>

<!-- APP -->
<div id="appPage" style="display:none;">
  <h2 id="headerTitle">เลือกเดือน</h2>

  <!-- หน้าเลือกเดือน -->
  <div id="monthPage"></div>

  <!-- หน้าแกลเลอรี่ -->
  <div id="galleryPage" style="display:none;">
    <button onclick="backToMonths()">⬅ กลับ</button>
    <br><br>

    <input type="file" id="upload">
    <input type="file" id="coverUpload">
    <input type="text" id="coverTextInput" placeholder="ข้อความหน้าปก">
    <button onclick="deleteCover()">ลบหน้าปก</button>

    <div id="gallery"></div>
  </div>
</div>

<!-- POPUP -->
<div id="popup" onclick="closePopup()">
  <div id="popupContent"></div>
</div>

<!-- JAVASCRIPT -->
<script>
document.addEventListener("DOMContentLoaded", () => {

const PASSWORD = "060768";

const monthNames = [
"มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน",
"กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"
];

const monthPage = document.getElementById("monthPage");
const galleryPage = document.getElementById("galleryPage");
const gallery = document.getElementById("gallery");
const upload = document.getElementById("upload");
const coverUpload = document.getElementById("coverUpload");
const coverTextInput = document.getElementById("coverTextInput");
const headerTitle = document.getElementById("headerTitle");

let currentMonth = null;

let memory = {};
let covers = JSON.parse(localStorage.getItem("covers") || "{}");
let coverTexts = JSON.parse(localStorage.getItem("coverTexts") || "{}");


// ================= เดือน =================
function renderMonths(){
    monthPage.innerHTML = "";
    monthNames.forEach((name,i)=>{
        const btn = document.createElement("div");
        btn.className = "month";
        btn.onclick = ()=> openMonth(i);

        if(covers[i]){
            btn.innerHTML = `
                <div class="cover-wrap">
                    <img src="${covers[i]}">
                    ${coverTexts[i] ? `<div class="cover-text">${coverTexts[i]}</div>` : ``}
                </div>
                <span>${name}</span>
            `;
        }else{
            btn.innerHTML = `
                <div class="no-cover">➕</div>
                <span>${name}</span>
            `;
        }

        monthPage.appendChild(btn);
    });
}


// ================= รหัสผ่าน =================
window.checkPassword = function(){
    const input = document.getElementById("passInput").value;
    if(input === PASSWORD){
        document.getElementById("loginPage").style.display="none";
        document.getElementById("appPage").style.display="block";
        renderMonths();
    }else{
        alert("รหัสผ่านไม่ถูกต้อง");
    }
}


// ================= เปิดเดือน =================
async function openMonth(index){
    currentMonth = index;
    headerTitle.innerText = monthNames[index];
    monthPage.style.display="none";
    galleryPage.style.display="block";

    await loadFromServer(index);
    showImages();

    coverTextInput.value = coverTexts[index] || "";
}

window.backToMonths = function(){
    headerTitle.innerText = "เลือกเดือน";
    galleryPage.style.display="none";
    monthPage.style.display="grid";
    renderMonths();
}


// ================= โหลดจาก server =================
async function loadFromServer(month){
    const res = await fetch("/files/" + month);
    const files = await res.json();

    memory[month] = files.map(url => ({
        type: url.match(/\.mp4|\.webm|\.mov/) ? "video" : "image",
        src: url
    }));
}


// ================= upload =================
if(upload){
upload.addEventListener("change", async (e)=>{
    const file = e.target.files[0];
    if(!file) return;

    const formData = new FormData();
    formData.append("file", file);

    const res = await fetch("/upload/" + currentMonth, {
        method: "POST",
        body: formData
    });

    const data = await res.json();

    if(!memory[currentMonth]) memory[currentMonth] = [];
    memory[currentMonth].push({
        type: file.type.startsWith("video") ? "video" : "image",
        src: data.url
    });

    showImages();
});
}


// ================= หน้าปก =================
if(coverUpload){
coverUpload.addEventListener("change", async (e)=>{
    const file = e.target.files[0];
    if(!file) return;

    const formData = new FormData();
    formData.append("file", file);

    const res = await fetch("/upload/cover_" + currentMonth, {
        method: "POST",
        body: formData
    });

    const data = await res.json();

    covers[currentMonth] = data.url;
    localStorage.setItem("covers", JSON.stringify(covers));
    renderMonths();
    alert("เปลี่ยนหน้าปกแล้ว 💗");
});
}

if(coverTextInput){
coverTextInput.addEventListener("input", ()=>{
    coverTexts[currentMonth] = coverTextInput.value;
    localStorage.setItem("coverTexts", JSON.stringify(coverTexts));
    renderMonths();
});
}

window.deleteCover = function(){
    delete covers[currentMonth];
    delete coverTexts[currentMonth];
    localStorage.setItem("covers", JSON.stringify(covers));
    localStorage.setItem("coverTexts", JSON.stringify(coverTexts));
    renderMonths();
}


// ================= แสดงรูป =================
function showImages(){
    gallery.innerHTML = "";
    if(!memory[currentMonth]) return;

    memory[currentMonth].forEach((item)=>{
        const wrap = document.createElement("div");
        wrap.className = "item-wrap";

        let el;
        if(item.type === "video"){
            el = document.createElement("video");
            el.src = item.src;
        }else{
            el = document.createElement("img");
            el.src = item.src;
        }

        el.onclick = ()=> openPopup(item);

        wrap.appendChild(el);
        gallery.appendChild(wrap);
    });
}


// ================= popup =================
function openPopup(item){
    const box = document.getElementById("popup");
    const content = document.getElementById("popupContent");
    content.innerHTML = "";

    let el;
    if(item.type === "video"){
        el = document.createElement("video");
        el.src = item.src;
        el.controls = true;
        el.autoplay = true;
    }else{
        el = document.createElement("img");
        el.src = item.src;
    }

    content.appendChild(el);
    box.style.display="flex";
}

window.closePopup = function(){
    document.getElementById("popup").style.display="none";
}

});
</script>

</body>
</html>
