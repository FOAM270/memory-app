<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory App</title>

<style>
body{
    margin:0;
    font-family: system-ui, sans-serif;
    background: linear-gradient(180deg,#ffd1dc,#fff0f5);
    display:flex;
    justify-content:center;
}

.app{
    width:100%;
    max-width:420px;
    min-height:100vh;
    background:white;
    box-shadow:0 0 20px rgba(0,0,0,0.15);
    overflow:hidden;
}

header{
    text-align:center;
    padding:15px;
    font-size:20px;
    font-weight:bold;
    color:white;
    background:#ff69b4;
}

/* login */
.login{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    width:100%;
    max-width:420px;
}

.login input{
    padding:10px;
    margin:10px;
    border-radius:10px;
    border:1px solid #ccc;
    text-align:center;
}

.login button{
    padding:8px 15px;
    border:none;
    border-radius:10px;
    background:#ff69b4;
    color:white;
}

/* เดือน */
.months{
    display:grid;
    grid-template-columns: repeat(3,1fr);
    gap:10px;
    padding:15px;
}

.month{
    border:none;
    border-radius:15px;
    background:#ff1493;
    color:white;
    font-weight:bold;
    overflow:hidden;
    position:relative;
    cursor:pointer;
    animation: floatbox 3s ease-in-out infinite;
    transition: transform 0.15s ease;
    box-shadow: 0 6px 12px rgba(0,0,0,0.15);
}

.month:active{
    transform: scale(0.95);
}

.month img{
    width:100%;
    height:70px;
    object-fit:cover;
}

/* overlay */
.cover-wrap{
    position:relative;
}
.cover-wrap::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.35);
}

.cover-text{
    position:absolute;
    bottom:6px;
    left:0;
    right:0;
    text-align:center;
    color:white;
    font-size:12px;
    font-weight:bold;
    z-index:2;
    text-shadow:0 2px 4px rgba(0,0,0,0.5);
}

.no-cover{
    height:70px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:26px;
}

.month span{
    display:block;
    padding:8px 5px;
}

@keyframes floatbox{
    0%{ transform:translateY(0); }
    50%{ transform:translateY(-5px); }
    100%{ transform:translateY(0); }
}

/* gallery */
.gallery{
    display:grid;
    grid-template-columns: repeat(3,1fr);
    gap:6px;
    padding:10px;
}

.item-wrap{
    position:relative;
}

.gallery img, .gallery video{
    width:100%;
    height:100px;
    object-fit:cover;
    border-radius:12px;
    cursor:pointer;
    animation: floatMedia 4s ease-in-out infinite;
}

@keyframes floatMedia{
    0%{ transform: translateY(0); }
    50%{ transform: translateY(-4px); }
    100%{ transform: translateY(0); }
}

.checkbox{
    position:absolute;
    top:4px;
    right:4px;
    width:18px;
    height:18px;
    z-index:3;
}

/* controls */
.controls{
    text-align:center;
    padding:10px;
}

.controls input, .controls button{
    margin-top:6px;
}

.delete-cover{
    border:none;
    background:#ff4d6d;
    color:white;
    padding:6px 10px;
    border-radius:8px;
}

.back{
    text-align:center;
    padding:10px;
}

.back button{
    border:none;
    padding:8px 12px;
    border-radius:10px;
    background:#ff69b4;
    color:white;
}

/* popup */
.popup{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    justify-content:center;
    align-items:center;
}

.popup img, .popup video{
    max-width:90%;
    max-height:90%;
    border-radius:20px;
}

/* hearts */
.heart{
    position:fixed;
    bottom:-20px;
    animation: float 6s linear infinite;
    color:#ff4d6d;
}

@keyframes float{
    from{ transform:translateY(0); opacity:1; }
    to{ transform:translateY(-100vh); opacity:0; }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginPage">
    <h2>PASSWORD 💗</h2>
    <input type="password" id="passInput">
    <button onclick="checkPassword()">เข้า</button>
</div>

<!-- APP -->
<div class="app" id="appPage" style="display:none;">
<header id="headerTitle">เลือกเดือน</header>

<div class="months" id="monthPage"></div>

<div id="galleryPage" style="display:none;">
    <div class="controls">
        <div>เพิ่มรูป / วิดีโอ</div>
        <input type="file" id="upload" accept="image/*,video/*">

        <button onclick="toggleSelect()">เลือกหลายรูป</button>
        <button onclick="deleteSelected()">ลบรูปที่เลือก</button>

        <div style="margin-top:10px;">ตั้งรูปหน้าปกเดือน</div>
        <input type="file" id="coverUpload" accept="image/*">

        <div>ข้อความบนหน้าปก</div>
        <input type="text" id="coverTextInput" placeholder="เช่น ทริปทะเล">

        <button class="delete-cover" onclick="deleteCover()">ลบหน้าปก</button>
    </div>

    <div class="gallery" id="gallery"></div>

    <div class="back">
        <button onclick="backToMonths()">⬅ กลับ</button>
    </div>
</div>
</div>

<!-- popup -->
<div class="popup" id="popup" onclick="closePopup()">
    <div id="popupContent"></div>
</div>

<script>
const PASSWORD = "060768";

const monthNames = [
"มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน",
"กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"
];

const monthPage = document.getElementById("monthPage");
const galleryPage = document.getElementById("galleryPage");
const gallery = document.getElementById("gallery");
const upload = document.getElementById("upload");
const coverUpload = document.getElementById("coverUpload");
const coverTextInput = document.getElementById("coverTextInput");
const headerTitle = document.getElementById("headerTitle");

let currentMonth = null;
let selectMode = false;
let selectedItems = new Set();

// โหลดข้อมูล
let memory = JSON.parse(localStorage.getItem("memory") || "{}");
let covers = JSON.parse(localStorage.getItem("covers") || "{}");
let coverTexts = JSON.parse(localStorage.getItem("coverTexts") || "{}");

// สร้างปุ่มเดือน
function renderMonths(){
    monthPage.innerHTML = "";
    monthNames.forEach((name,i)=>{
        const btn = document.createElement("div");
        btn.className = "month";
        btn.onclick = ()=> openMonth(i);

        if(covers[i]){
            btn.innerHTML = `
                <div class="cover-wrap">
                    <img src="${covers[i]}">
                    ${coverTexts[i] ? `<div class="cover-text">${coverTexts[i]}</div>` : ``}
                </div>
                <span>${name}</span>
            `;
        }else{
            btn.innerHTML = `
                <div class="no-cover">➕</div>
                <span>${name}</span>
            `;
        }

        monthPage.appendChild(btn);
    });
}

function checkPassword(){
    const input = document.getElementById("passInput").value;
    if(input === PASSWORD){
        document.getElementById("loginPage").style.display="none";
        document.getElementById("appPage").style.display="block";
        renderMonths();
    }else{
        alert("รหัสผ่านไม่ถูกต้อง");
    }
}

function openMonth(index){
    currentMonth = index;
    headerTitle.innerText = monthNames[index];
    monthPage.style.display="none";
    galleryPage.style.display="block";
    showImages();
    coverTextInput.value = coverTexts[index] || "";
}

function backToMonths(){
    headerTitle.innerText = "เลือกเดือน";
    galleryPage.style.display="none";
    monthPage.style.display="grid";
    renderMonths();
}

// อัปโหลดรูป/วิดีโอ
upload.addEventListener("change", (e)=>{
    const file = e.target.files[0];
    if(!file) return;

    const reader = new FileReader();
    reader.onload = function(event){
        if(!memory[currentMonth]) memory[currentMonth] = [];
        memory[currentMonth].push({
            type:file.type.startsWith("video") ? "video" : "image",
            src:event.target.result
        });

        localStorage.setItem("memory", JSON.stringify(memory));
        showImages();
    }
    reader.readAsDataURL(file);
});

// โหมดเลือก
function toggleSelect(){
    selectMode = !selectMode;
    selectedItems.clear();
    showImages();
}

// ลบรูปที่เลือก
function deleteSelected(){
    if(!memory[currentMonth]) return;

    memory[currentMonth] = memory[currentMonth].filter((_,i)=>!selectedItems.has(i));
    localStorage.setItem("memory", JSON.stringify(memory));

    selectMode = false;
    selectedItems.clear();
    showImages();
}

// อัปโหลดหน้าปก
coverUpload.addEventListener("change", (e)=>{
    const file = e.target.files[0];
    if(!file) return;

    const reader = new FileReader();
    reader.onload = function(event){
        covers[currentMonth] = event.target.result;
        localStorage.setItem("covers", JSON.stringify(covers));
        renderMonths();
        alert("เปลี่ยนหน้าปกแล้ว 💗");
    }
    reader.readAsDataURL(file);
});

// บันทึกข้อความ
coverTextInput.addEventListener("input", ()=>{
    coverTexts[currentMonth] = coverTextInput.value;
    localStorage.setItem("coverTexts", JSON.stringify(coverTexts));
    renderMonths();
});

// ลบหน้าปก
function deleteCover(){
    delete covers[currentMonth];
    delete coverTexts[currentMonth];
    localStorage.setItem("covers", JSON.stringify(covers));
    localStorage.setItem("coverTexts", JSON.stringify(coverTexts));
    renderMonths();
    alert("ลบหน้าปกแล้ว");
}

function showImages(){
    gallery.innerHTML = "";
    if(!memory[currentMonth]) return;

    memory[currentMonth].forEach((item,index)=>{
        const wrap = document.createElement("div");
        wrap.className = "item-wrap";

        let el;
        if(item.type === "video"){
            el = document.createElement("video");
            el.src = item.src;
        }else{
            el = document.createElement("img");
            el.src = item.src;
        }

        if(selectMode){
            const cb = document.createElement("input");
            cb.type = "checkbox";
            cb.className = "checkbox";
            cb.onchange = ()=> {
                if(cb.checked) selectedItems.add(index);
                else selectedItems.delete(index);
            };
            wrap.appendChild(cb);
        }else{
            el.onclick = ()=> openPopup(item);
        }

        wrap.appendChild(el);
        gallery.appendChild(wrap);
    });
}

function openPopup(item){
    const box = document.getElementById("popup");
    const content = document.getElementById("popupContent");
    content.innerHTML = "";

    let el;
    if(item.type === "video"){
        el = document.createElement("video");
        el.src = item.src;
        el.controls = true;
        el.autoplay = true;
    }else{
        el = document.createElement("img");
        el.src = item.src;
    }

    content.appendChild(el);
    box.style.display="flex";
}

function closePopup(){
    document.getElementById("popup").style.display="none";
}

/* หัวใจ */
setInterval(()=>{
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (Math.random()*20+10) + "px";
    heart.innerHTML = "❤";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),6000);
},500);
</script>

</body>
</html>
