<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory App</title>

<link href="https://fonts.googleapis.com/css2?family=Mali:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Mali',system-ui,sans-serif;
    background: linear-gradient(180deg,#ffc1e3,#ffe4f2,#fff0f6);
    display:flex;
    justify-content:center;
}

.app{
    width:100%;
    max-width:420px;
    min-height:100vh;
    background:white;
    box-shadow:0 0 20px rgba(0,0,0,0.15);
    overflow:hidden;
}

header{
    text-align:center;
    padding:15px;
    font-size:20px;
    font-weight:bold;
    color:white;
    background: linear-gradient(90deg,#ff69b4,#ff85c1);
}

/* login */
.login{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    width:100%;
    max-width:420px;
}

.login input{
    padding:10px;
    margin:10px;
    border-radius:10px;
    border:1px solid #ccc;
    text-align:center;
}

.login button{
    padding:8px 15px;
    border:none;
    border-radius:10px;
    background:#ff69b4;
    color:white;
}

/* เดือน */
.months{
    display:grid;
    grid-template-columns: repeat(3,1fr);
    gap:10px;
    padding:15px;
}

.month{
    border:none;
    border-radius:15px;
    background:#ff69b4;
    color:white;
    font-weight:bold;
    overflow:hidden;
    cursor:pointer;
}

.month img{
    width:100%;
    height:70px;
    object-fit:cover;
}

.cover-wrap{ position:relative; }
.cover-wrap::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.35);
}

.cover-text{
    position:absolute;
    bottom:6px;
    left:0;
    right:0;
    text-align:center;
    color:white;
    font-size:12px;
    font-weight:bold;
    z-index:2;
}

.no-cover{
    height:70px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:26px;
}

.month span{
    display:block;
    padding:8px 5px;
}

/* gallery */
.gallery{
    display:grid;
    grid-template-columns: repeat(3,1fr);
    gap:6px;
    padding:10px;
}

.gallery img, .gallery video{
    width:100%;
    height:100px;
    object-fit:cover;
    border-radius:12px;
    cursor:pointer;
}

.controls{
    text-align:center;
    padding:10px;
}

.delete-cover{
    border:none;
    background:#ff4d6d;
    color:white;
    padding:6px 10px;
    border-radius:8px;
}

.back{
    text-align:center;
    padding:10px;
}

.back button{
    border:none;
    padding:8px 12px;
    border-radius:10px;
    background:#ff69b4;
    color:white;
}

/* popup */
.popup{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    justify-content:center;
    align-items:center;
}

.popup img, .popup video{
    max-width:90%;
    max-height:90%;
    border-radius:20px;
}

/* hearts */
@keyframes floatHeart{
    from{ transform:translateY(0); opacity:1; }
    to{ transform:translateY(-100vh); opacity:0; }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginPage">
    <h2>PASSWORD 💗</h2>
    <input type="password" id="passInput">
    <button onclick="checkPassword()">เข้า</button>
</div>

<!-- APP -->
<div class="app" id="appPage" style="display:none;">
<header id="headerTitle">เลือกเดือน</header>

<div class="months" id="monthPage"></div>

<div id="galleryPage" style="display:none;">
    <div class="controls">
        <div>เพิ่มรูป / วิดีโอ</div>
        <input type="file" id="upload" accept="image/*,video/*">

        <div style="margin-top:10px;">ตั้งรูปหน้าปก</div>
        <input type="file" id="coverUpload" accept="image/*">

        <div>ข้อความบนหน้าปก</div>
        <input type="text" id="coverTextInput">

        <button class="delete-cover" onclick="deleteCover()">ลบหน้าปก</button>
    </div>

    <div class="gallery" id="gallery"></div>

    <div class="back">
        <button onclick="backToMonths()">⬅ กลับ</button>
    </div>
</div>
</div>

<!-- popup -->
<div class="popup" id="popup" onclick="closePopup()">
    <div id="popupContent"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

const PASSWORD = "060768";

const monthNames = [
"มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน",
"กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"
];

const monthPage = document.getElementById("monthPage");
const galleryPage = document.getElementById("galleryPage");
const gallery = document.getElementById("gallery");
const upload = document.getElementById("upload");
const coverUpload = document.getElementById("coverUpload");
const coverTextInput = document.getElementById("coverTextInput");
const headerTitle = document.getElementById("headerTitle");

let currentMonth = null;

let memory = {};
let covers = JSON.parse(localStorage.getItem("covers") || "{}");
let coverTexts = JSON.parse(localStorage.getItem("coverTexts") || "{}");

function renderMonths(){
    monthPage.innerHTML = "";
    monthNames.forEach((name,i)=>{
        const btn = document.createElement("div");
        btn.className = "month";
        btn.onclick = ()=> openMonth(i);

        if(covers[i]){
            btn.innerHTML = `
                <div class="cover-wrap">
                    <img src="${covers[i]}">
                    ${coverTexts[i] ? `<div class="cover-text">${coverTexts[i]}</div>` : ``}
                </div>
                <span>${name}</span>
            `;
        }else{
            btn.innerHTML = `
                <div class="no-cover">➕</div>
                <span>${name}</span>
            `;
        }

        monthPage.appendChild(btn);
    });
}

window.checkPassword = function(){
    const input = document.getElementById("passInput").value;
    if(input === PASSWORD){
        document.getElementById("loginPage").style.display="none";
        document.getElementById("appPage").style.display="block";
        renderMonths();
    }else{
        alert("รหัสผ่านไม่ถูกต้อง");
    }
}

async function openMonth(index){
    currentMonth = index;
    headerTitle.innerText = monthNames[index];
    monthPage.style.display="none";
    galleryPage.style.display="block";

    const res = await fetch("/files/" + index);
    const files = await res.json();

    memory[index] = files.map(url => ({
        type: url.match(/\.mp4|\.webm|\.mov/) ? "video" : "image",
        src: url
    }));

    showImages();
    coverTextInput.value = coverTexts[index] || "";
}

window.backToMonths = function(){
    headerTitle.innerText = "เลือกเดือน";
    galleryPage.style.display="none";
    monthPage.style.display="grid";
    renderMonths();
}

if(upload){
upload.addEventListener("change", async (e)=>{
    const file = e.target.files[0];
    if(!file) return;

    const formData = new FormData();
    formData.append("file", file);

    const res = await fetch("/upload/" + currentMonth, {
        method: "POST",
        body: formData
    });

    const data = await res.json();

    memory[currentMonth].push({
        type: file.type.startsWith("video") ? "video" : "image",
        src: data.url
    });

    showImages();
});
}

if(coverUpload){
coverUpload.addEventListener("change", async (e)=>{
    const file = e.target.files[0];
    if(!file) return;

    const formData = new FormData();
    formData.append("file", file);

    const res = await fetch("/upload/cover_" + currentMonth, {
        method: "POST",
        body: formData
    });

    const data = await res.json();

    covers[currentMonth] = data.url;
    localStorage.setItem("covers", JSON.stringify(covers));
    renderMonths();
});
}

if(coverTextInput){
coverTextInput.addEventListener("input", ()=>{
    coverTexts[currentMonth] = coverTextInput.value;
    localStorage.setItem("coverTexts", JSON.stringify(coverTexts));
    renderMonths();
});
}

window.deleteCover = function(){
    delete covers[currentMonth];
    delete coverTexts[currentMonth];
    localStorage.setItem("covers", JSON.stringify(covers));
    localStorage.setItem("coverTexts", JSON.stringify(coverTexts));
    renderMonths();
}

function showImages(){
    gallery.innerHTML = "";
    if(!memory[currentMonth]) return;

    memory[currentMonth].forEach((item)=>{
        const wrap = document.createElement("div");

        let el;
        if(item.type === "video"){
            el = document.createElement("video");
            el.src = item.src;
        }else{
            el = document.createElement("img");
            el.src = item.src;
        }

        el.onclick = ()=> openPopup(item);
        wrap.appendChild(el);
        gallery.appendChild(wrap);
    });
}

function openPopup(item){
    const box = document.getElementById("popup");
    const content = document.getElementById("popupContent");
    content.innerHTML = "";

    let el;
    if(item.type === "video"){
        el = document.createElement("video");
        el.src = item.src;
        el.controls = true;
        el.autoplay = true;
    }else{
        el = document.createElement("img");
        el.src = item.src;
    }

    content.appendChild(el);
    box.style.display="flex";
}

window.closePopup = function(){
    document.getElementById("popup").style.display="none";
}

});
</script>

<script>
setInterval(()=>{
    const heart = document.createElement("div");
    heart.innerHTML = "💗";
    heart.style.position = "fixed";
    heart.style.left = Math.random()*100 + "vw";
    heart.style.bottom = "-20px";
    heart.style.fontSize = (Math.random()*20+15) + "px";
    heart.style.opacity = Math.random();
    heart.style.animation = "floatHeart 6s linear";
    document.body.appendChild(heart);

    setTimeout(()=> heart.remove(),6000);
}, 400);
</script>

</body>
</html>
