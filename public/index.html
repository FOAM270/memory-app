<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory App 💗</title>

<link href="https://fonts.googleapis.com/css2?family=Mali:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Mali',system-ui,sans-serif;
    background: linear-gradient(180deg,#ffc1e3,#ffe4f2,#fff0f6);
    display:flex;
    justify-content:center;
}

.app{
    width:100%;
    max-width:420px;
    min-height:100vh;
    background:white;
    box-shadow:0 0 20px rgba(0,0,0,0.15);
    overflow:hidden;
}

header{
    text-align:center;
    padding:15px;
    font-size:20px;
    font-weight:bold;
    color:white;
    background: linear-gradient(90deg,#ff69b4,#ff85c1);
}

/* login */
.login{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    width:100%;
    max-width:420px;
}

.login input{
    padding:10px;
    margin:10px;
    border-radius:10px;
    border:1px solid #ccc;
    text-align:center;
}

.login button{
    padding:8px 15px;
    border:none;
    border-radius:10px;
    background:#ff69b4;
    color:white;
}

/* เดือน */
.months{
    display:grid;
    grid-template-columns: repeat(3,1fr);
    gap:10px;
    padding:15px;
}

.month{
    border-radius:15px;
    background:#ff69b4;
    color:white;
    font-weight:bold;
    overflow:hidden;
    cursor:pointer;
}

.month img{
    width:100%;
    height:70px;
    object-fit:cover;
}

.cover-text{
    position:absolute;
    bottom:6px;
    left:0;
    right:0;
    text-align:center;
    color:white;
    font-size:12px;
    font-weight:bold;
}

.no-cover{
    height:70px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:26px;
}

.month span{
    display:block;
    padding:8px 5px;
}

/* gallery */
.gallery{
    display:grid;
    grid-template-columns: repeat(3,1fr);
    gap:6px;
    padding:10px;
}

.gallery img, .gallery video{
    width:100%;
    height:100px;
    object-fit:cover;
    border-radius:12px;
    cursor:pointer;
}

.selected{
    border:3px solid red;
}

.controls{
    text-align:center;
    padding:10px;
}

.controls button{
    margin:5px;
    padding:6px 10px;
    border:none;
    border-radius:8px;
    background:#ff69b4;
    color:white;
}

.delete-btn{
    background:#ff4d6d !important;
}

/* popup */
.popup{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    justify-content:center;
    align-items:center;
}

.popup img, .popup video{
    max-width:90%;
    max-height:90%;
    border-radius:20px;
}

@keyframes floatHeart{
    from{ transform:translateY(0); opacity:1; }
    to{ transform:translateY(-100vh); opacity:0; }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginPage">
    <h2>PASSWORD 💗</h2>
    <input type="password" id="passInput">
    <button onclick="checkPassword()">เข้า</button>
</div>

<!-- APP -->
<div class="app" id="appPage" style="display:none;">
<header id="headerTitle">เลือกเดือน</header>

<div class="months" id="monthPage"></div>

<div id="galleryPage" style="display:none;">
    <div class="controls">
        <input type="file" id="upload" accept="image/*,video/*"><br>
        <button onclick="toggleSelect()">เลือก</button>
        <button class="delete-btn" onclick="deleteSelected()">ลบ</button>

        <div style="margin-top:10px;">ตั้งหน้าปก</div>
        <input type="file" id="coverUpload" accept="image/*">
    </div>

    <div class="gallery" id="gallery"></div>

    <div style="text-align:center;padding:10px;">
        <button onclick="backToMonths()">⬅ กลับ</button>
    </div>
</div>
</div>

<!-- popup -->
<div class="popup" id="popup" onclick="closePopup()">
    <div id="popupContent"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

const PASSWORD = "060768";

const monthNames = [
"มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน",
"กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"
];

const monthPage = document.getElementById("monthPage");
const galleryPage = document.getElementById("galleryPage");
const gallery = document.getElementById("gallery");
const upload = document.getElementById("upload");
const coverUpload = document.getElementById("coverUpload");
const headerTitle = document.getElementById("headerTitle");

let currentMonth = null;
let memory = {};

let selectMode = false;
let selected = new Set();


// ================= เดือน =================
function renderMonths(){
    monthPage.innerHTML = "";
    monthNames.forEach((name,i)=>{
        const btn = document.createElement("div");
        btn.className = "month";
        btn.onclick = ()=> openMonth(i);
        btn.innerHTML = `<div class="no-cover">📁</div><span>${name}</span>`;
        monthPage.appendChild(btn);
    });
}


// ================= รหัสผ่าน =================
window.checkPassword = function(){
    const input = document.getElementById("passInput").value;
    if(input === PASSWORD){
        document.getElementById("loginPage").style.display="none";
        document.getElementById("appPage").style.display="block";
        renderMonths();
    }else{
        alert("รหัสผ่านไม่ถูกต้อง");
    }
}


// ================= เปิดเดือน =================
async function openMonth(index){
    currentMonth = index;
    headerTitle.innerText = monthNames[index];
    monthPage.style.display="none";
    galleryPage.style.display="block";

    await loadImages();
}

window.backToMonths = function(){
    headerTitle.innerText = "เลือกเดือน";
    galleryPage.style.display="none";
    monthPage.style.display="grid";
}


// ================= โหลดจาก SERVER =================
async function loadImages(){
    const res = await fetch("/files/" + currentMonth);
    const files = await res.json();

    memory[currentMonth] = files.map(url => ({
        type: url.match(/\.mp4|\.webm|\.mov/) ? "video" : "image",
        src: url
    }));

    showImages();
}


// ================= upload =================
if(upload){
upload.addEventListener("change", async (e)=>{
    const file = e.target.files[0];
    if(!file) return;

    const formData = new FormData();
    formData.append("file", file);

    await fetch("/upload/" + currentMonth, {
        method:"POST",
        body:formData
    });

    await loadImages();
});
}


// ================= เลือก =================
window.toggleSelect = function(){
    selectMode = !selectMode;
    selected.clear();
    showImages();
}


// ================= ลบ =================
window.deleteSelected = async function(){
    if(selected.size === 0) return alert("ยังไม่ได้เลือกรูป");

    await fetch("/delete", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
            month: currentMonth,
            urls: [...selected]
        })
    });

    selectMode = false;
    selected.clear();
    await loadImages();
}


// ================= ตั้งหน้าปก =================
if(coverUpload){
coverUpload.addEventListener("change", async (e)=>{
    const file = e.target.files[0];
    if(!file) return;

    const formData = new FormData();
    formData.append("file", file);

    const up = await fetch("/upload/cover_" + currentMonth, {
        method:"POST",
        body:formData
    });

    const data = await up.json();

    await fetch("/cover/" + currentMonth, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ url: data.url })
    });

    alert("ตั้งหน้าปกแล้ว 💗");
});
}


// ================= แสดงรูป =================
function showImages(){
    gallery.innerHTML = "";
    if(!memory[currentMonth]) return;

    memory[currentMonth].forEach((item)=>{
        let el;
        if(item.type === "video"){
            el = document.createElement("video");
        }else{
            el = document.createElement("img");
        }

        el.src = item.src;

        if(selectMode){
            el.onclick = ()=>{
                if(selected.has(item.src)){
                    selected.delete(item.src);
                    el.classList.remove("selected");
                }else{
                    selected.add(item.src);
                    el.classList.add("selected");
                }
            };
        }else{
            el.onclick = ()=> openPopup(item);
        }

        gallery.appendChild(el);
    });
}


// ================= popup =================
function openPopup(item){
    const box = document.getElementById("popup");
    const content = document.getElementById("popupContent");
    content.innerHTML = "";

    let el;
    if(item.type === "video"){
        el = document.createElement("video");
        el.controls = true;
        el.autoplay = true;
    }else{
        el = document.createElement("img");
    }

    el.src = item.src;
    content.appendChild(el);
    box.style.display="flex";
}

window.closePopup = function(){
    document.getElementById("popup").style.display="none";
}

});


// ================= หัวใจลอย =================
setInterval(()=>{
    const heart = document.createElement("div");
    heart.innerHTML = "💗";
    heart.style.position = "fixed";
    heart.style.left = Math.random()*100 + "vw";
    heart.style.bottom = "-20px";
    heart.style.fontSize = (Math.random()*20+15) + "px";
    heart.style.opacity = Math.random();
    heart.style.animation = "floatHeart 6s linear";
    document.body.appendChild(heart);
    setTimeout(()=> heart.remove(),6000);
}, 400);

</script>

</body>
</html>
