<script>
document.addEventListener("DOMContentLoaded", () => {

const PASSWORD = "060768";

const monthNames = [
"มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน",
"กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"
];

const monthPage = document.getElementById("monthPage");
const galleryPage = document.getElementById("galleryPage");
const gallery = document.getElementById("gallery");
const upload = document.getElementById("upload");
const coverUpload = document.getElementById("coverUpload");
const coverTextInput = document.getElementById("coverTextInput");
const headerTitle = document.getElementById("headerTitle");

let currentMonth = null;
let selectMode = false;
let selectedItems = new Set();

let memory = {};
let covers = JSON.parse(localStorage.getItem("covers") || "{}");
let coverTexts = JSON.parse(localStorage.getItem("coverTexts") || "{}");


// ================== เดือน ==================
function renderMonths(){
    monthPage.innerHTML = "";
    monthNames.forEach((name,i)=>{
        const btn = document.createElement("div");
        btn.className = "month";
        btn.onclick = ()=> openMonth(i);

        if(covers[i]){
            btn.innerHTML = `
                <div class="cover-wrap">
                    <img src="${covers[i]}">
                    ${coverTexts[i] ? `<div class="cover-text">${coverTexts[i]}</div>` : ``}
                </div>
                <span>${name}</span>
            `;
        }else{
            btn.innerHTML = `
                <div class="no-cover">➕</div>
                <span>${name}</span>
            `;
        }

        monthPage.appendChild(btn);
    });
}


// ================== รหัสผ่าน ==================
window.checkPassword = function(){
    const input = document.getElementById("passInput").value;
    if(input === PASSWORD){
        document.getElementById("loginPage").style.display="none";
        document.getElementById("appPage").style.display="block";
        renderMonths();
    }else{
        alert("รหัสผ่านไม่ถูกต้อง");
    }
}


// ================== เปิดเดือน ==================
async function openMonth(index){
    currentMonth = index;
    headerTitle.innerText = monthNames[index];
    monthPage.style.display="none";
    galleryPage.style.display="block";

    await loadFromServer(index);
    showImages();

    coverTextInput.value = coverTexts[index] || "";
}

window.backToMonths = function(){
    headerTitle.innerText = "เลือกเดือน";
    galleryPage.style.display="none";
    monthPage.style.display="grid";
    renderMonths();
}


// ================== โหลดจาก SERVER ==================
async function loadFromServer(month){
    const res = await fetch("/files/" + month);
    const files = await res.json();

    memory[month] = files.map(url => ({
        type: url.match(/\.mp4|\.webm|\.mov/) ? "video" : "image",
        src: url
    }));
}


// ================== อัปโหลด ==================
if(upload){
upload.addEventListener("change", async (e)=>{
    const file = e.target.files[0];
    if(!file) return;

    const formData = new FormData();
    formData.append("file", file);

    const res = await fetch("/upload/" + currentMonth, {
        method: "POST",
        body: formData
    });

    const data = await res.json();

    if(!memory[currentMonth]) memory[currentMonth] = [];
    memory[currentMonth].push({
        type: file.type.startsWith("video") ? "video" : "image",
        src: data.url
    });

    showImages();
});
}


// ================== หน้าปก ==================
if(coverUpload){
coverUpload.addEventListener("change", async (e)=>{
    const file = e.target.files[0];
    if(!file) return;

    const formData = new FormData();
    formData.append("file", file);

    const res = await fetch("/upload/cover_" + currentMonth, {
        method: "POST",
        body: formData
    });

    const data = await res.json();

    covers[currentMonth] = data.url;
    localStorage.setItem("covers", JSON.stringify(covers));
    renderMonths();
    alert("เปลี่ยนหน้าปกแล้ว 💗");
});
}

if(coverTextInput){
coverTextInput.addEventListener("input", ()=>{
    coverTexts[currentMonth] = coverTextInput.value;
    localStorage.setItem("coverTexts", JSON.stringify(coverTexts));
    renderMonths();
});
}

window.deleteCover = function(){
    delete covers[currentMonth];
    delete coverTexts[currentMonth];
    localStorage.setItem("covers", JSON.stringify(covers));
    localStorage.setItem("coverTexts", JSON.stringify(coverTexts));
    renderMonths();
}


// ================== แสดงรูป ==================
function showImages(){
    gallery.innerHTML = "";
    if(!memory[currentMonth]) return;

    memory[currentMonth].forEach((item)=>{
        const wrap = document.createElement("div");
        wrap.className = "item-wrap";

        let el;
        if(item.type === "video"){
            el = document.createElement("video");
            el.src = item.src;
        }else{
            el = document.createElement("img");
            el.src = item.src;
        }

        el.onclick = ()=> openPopup(item);

        wrap.appendChild(el);
        gallery.appendChild(wrap);
    });
}


// ================== popup ==================
function openPopup(item){
    const box = document.getElementById("popup");
    const content = document.getElementById("popupContent");
    content.innerHTML = "";

    let el;
    if(item.type === "video"){
        el = document.createElement("video");
        el.src = item.src;
        el.controls = true;
        el.autoplay = true;
    }else{
        el = document.createElement("img");
        el.src = item.src;
    }

    content.appendChild(el);
    box.style.display="flex";
}

window.closePopup = function(){
    document.getElementById("popup").style.display="none";
}

});
</script>
